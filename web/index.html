<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>lxserver 音乐</title>

    <!-- PWA：可安装到主屏/桌面，独立窗口打开。
         manifest 与 sw.js 都放在 public/ 下，Vite 按 base('/app/') 原样拷到 app/ 根。
         v2.33 起 scope/start_url 是根 `/`（服务端在根路径直投 /manifest.json 与 /sw.js），
         让「从根路径访问的用户」也能安装。 -->
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#4f46e5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />
    <!-- 浏览器标签页 / 书签 / 桌面快捷方式的图标（部分浏览器不看 manifest 的 icons） -->
    <link rel="icon" type="image/png" sizes="192x192" href="/app/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/app/icons/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/app/icons/apple-touch-icon.png" />
    <!-- iOS 不吃 manifest 的 theme_color / display，这几条是老版本 Safari 的补丁 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- default = 状态栏用系统默认（白底黑字），与本应用的亮色主题一致；
         black-translucent 会把状态栏浮在页面内容上 —— 那时才需要 safe-area-inset-top，
         这里选 default 更稳妥（顶部由系统接管，页面内容不被刘海压住）。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="lxserver" />

    <!-- 一次性迁移：注销旧版播放器遗留在根作用域的 Service Worker。
         必须是**普通 script 且放在这里**（早于 type="module" 的 bundle 执行），
         否则首次访问清不掉，会留下一个「拿到旧 HTML → 白屏」的窗口期。
         原因详见该文件头部注释。 -->
    <script src="/app/unregister-legacy-sw.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
