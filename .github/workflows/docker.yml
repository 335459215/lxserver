name: Build and Push Docker Image

on:
  workflow_call:
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  # 使用 github.repository_owner 获取用户名，并指定镜像名为 lxserver
  IMAGE_NAME: ${{ github.repository_owner }}/lxserver
  # Docker Hub 仓库名
  DOCKER_HUB_REPO: ${{ secrets.DOCKER_USERNAME }}/lxserver

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Add QEMU for multi-platform build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # [v2.23.0] 版本号与 buildHash 的落点变更：
      #   - 版本号改读仓库根 `version` 文件（`public/js/config.js` 已随旧版播放器删除）
      #   - buildHash 不再写入任何文件（原目标 config.js 已删），故提交步骤去掉
      # 注：本 workflow 仅 workflow_call / workflow_dispatch 触发，当前发布链路由
      # build-image-ghcr.yml 承担；这里同步修正是为了避免将来手动触发时报错。
      - name: Read version
        id: get_version
        run: |
          if [ -f public/js/config.js ]; then
            VERSION=$(grep "version:" public/js/config.js | sed "s/.*'\(.*\)'.*/\1/")
          else
            VERSION=$(cat version 2>/dev/null | tr -d '[:space:]')
          fi
          [ -z "$VERSION" ] && VERSION="${GITHUB_REF_NAME}"
          echo "PROJECT_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected version: $VERSION"

      - name: Sync package.json version
        run: node scripts/update-build-hash.js
        continue-on-error: true

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKER_HUB_REPO }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.PROJECT_VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=LX Music Sync Server (Enhanced Edition)
            org.opencontainers.image.licenses=Apache-2.0

      - name: Delete old Docker image versions
        run: |
          PACKAGE_NAME="lxserver"
          OWNER="${{ github.repository_owner }}"
          
          for TAG in "${{ env.PROJECT_VERSION }}"; do
            echo "Checking for existing tag: $TAG"
            
            # 优先尝试用户 API，再尝试组织 API
            # 使用 --jq 过滤出 ID，如果命令失败或没找到，则返回空
            VERSION_ID=$(gh api "/users/$OWNER/packages/container/$PACKAGE_NAME/versions" --jq ".[] | select(.metadata.container.tags // [] | contains([\"$TAG\"])) | .id" 2>/dev/null || \
                        gh api "/orgs/$OWNER/packages/container/$PACKAGE_NAME/versions" --jq ".[] | select(.metadata.container.tags // [] | contains([\"$TAG\"])) | .id" 2>/dev/null || echo "")
            
            # 确保 VERSION_ID 是数字（有效的 ID），而不是 JSON 错误信息
            if [[ "$VERSION_ID" =~ ^[0-9]+$ ]]; then
              echo "Deleting old version for $TAG (ID: $VERSION_ID)"
              gh api -X DELETE "/users/$OWNER/packages/container/$PACKAGE_NAME/versions/$VERSION_ID" 2>/dev/null || \
              gh api -X DELETE "/orgs/$OWNER/packages/container/$PACKAGE_NAME/versions/$VERSION_ID" 2>/dev/null || echo "Delete failed, skipping..."
            else
              echo "No valid existing version ID found for tag: $TAG, skipping cleanup."
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Enable multi-platform build
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
